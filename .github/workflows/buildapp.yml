# Updated workflow: now codesigns the built IPA with fastlane
# Requires the following repository secrets (all **base64‑encoded** unless stated):
#   CERTIFICATE_P12          – the .p12 export of your "Apple Distribution" certificate
#   CERTIFICATE_PASSWORD     – password used when exporting the .p12            (plain text)
#   KEYCHAIN_PASSWORD        – random password to protect the temporary keychain (plain text)
#   MOBILEPROVISION_BASE64   – provisioning profile matching the bundle‑ID      (base64)
#   APPLE_ID                 – Apple ID used by fastlane match / notarisation   (plain text)
#   TEAM_ID                  – 10‑character Apple Developer Team ID            (plain text)
#   MATCH_PASSWORD           – repo password if you use match (optional)
#
# Original workflow by @ISnackable — extended by ChatGPT to add signing.

name: Build, Sign and Release YTLitePlus

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "17.5"
        required: true
        type: string
      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube ipa"
        default: ""
        required: true
        type: string
      bundle_id:
        description: "Modify the bundle ID"
        default: "dev.velka.yt"
        required: true
        type: string
      app_name:
        description: "Modify the app name"
        default: "YouTube"
        required: true
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload iPA as artifact (Public)"
        default: true
        required: false
        type: boolean
      catbox_upload:
        description: "Upload iPA to Catbox.moe (URL)"
        default: false
        required: false
        type: boolean
      create_release:
        description: "Create a draft release (Private)"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Sign YTLitePlus
    runs-on: macos-13
    permissions:
      contents: write
    env:
      APP_IDENTIFIER: ${{ inputs.bundle_id }}
      FASTLANE_DISABLE_COLORS: "1"

    steps:
      # ------------------------------------------------------------
      # 1. Build –– **unchanged** except for env propagation
      # ------------------------------------------------------------
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Download Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: iOS SDK Caching
        id: SDK
        uses: actions/cache@v4
        env:
          cache-name: iOS-${{ inputs.sdk_version }}-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/aricloverALT/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Download Theos Jailed
        uses: actions/checkout@v4
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed
          submodules: recursive

      - name: Install Theos Jailed
        run: ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Fix Compiling
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          (echo export PATH="/usr/local/opt/make/libexec/gnubin:$PATH" >> ~/.bash_profile)
          source ~/.bash_profile

      # ------------------------------------------------------------
      # 2. Prepare the decrypted YouTube IPA –– unchanged
      # ------------------------------------------------------------
      - name: Hash YT ipa url
        run: |
          URL_YT="$(jq -r '.inputs.decrypted_youtube_url' $GITHUB_EVENT_PATH)"
          echo ::add-mask::$URL_YT
          echo URL_YT=$URL_YT >> $GITHUB_ENV

      - name: Prepare YouTube iPA
        run: |
          wget "$YOUTUBE_URL" --quiet --no-verbose -O main/YouTube.ipa
          unzip -q main/YouTube.ipa -d main/tmp
          echo "YT_VERSION=$(grep -A 1 '<key>CFBundleVersion</key>' main/tmp/Payload/YouTube.app/Info.plist | grep '<string>' | awk -F'[><]' '{print $3}')" >> $GITHUB_ENV
          wget -qO- https://github.com/dayanch96/YTLite/releases/latest > main/tmp/release_page.html
          YTLITE_VERSION=$(grep -o -E '/tag/v[^" ]+' main/tmp/release_page.html | head -n 1 | sed 's/\/tag\/v//')
          echo "YTLITE_VERSION=5.0.1" >> $GITHUB_ENV
          rm -rf main/tmp/Payload/YouTube.app/_CodeSignature/CodeResources
          rm -rf main/tmp/Payload/YouTube.app/PlugIns/*
          python - <<'PY'
import plistlib, sys
p = 'main/tmp/Payload/YouTube.app/Info.plist'
with open(p, 'rb') as f:
    pl = plistlib.load(f)
pl.pop('UISupportedDevices', None)
with open(p, 'wb') as f:
    plistlib.dump(pl, f)
PY
          cp -R main/Extensions/*.appex main/tmp/Payload/YouTube.app/PlugIns
        env:
          THEOS: ${{ github.workspace }}/theos
          YOUTUBE_URL: ${{ env.URL_YT }}

      # ------------------------------------------------------------
      # 3. Build (Theos) –– unchanged
      # ------------------------------------------------------------
      - name: Build Package
        id: build_package
        run: |
          cd ${{ github.workspace }}/main
          sed -i '' "s/^BUNDLE_ID.*$/BUNDLE_ID = ${{ env.BUNDLE_ID }}/" Makefile
          sed -i '' "s/^DISPLAY_NAME.*$/DISPLAY_NAME = ${{ env.APP_NAME }}/" Makefile
          sed -i '' "s/^PACKAGE_VERSION.*$/PACKAGE_VERSION = ${{ env.YT_VERSION }}-5.0.1/" Makefile
          sed -i '' "s/^export TARGET.*$/export TARGET = iphone:clang:${{ inputs.sdk_version }}:14.0/" Makefile
          sed -i '' "s/^export SDK_PATH.*$/export SDK_PATH = \$(THEOS)\/sdks\/iPhoneOS${{ inputs.sdk_version }}.sdk\//" Makefile
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          mv "packages/$(ls -t packages | head -n1)" "packages/YTLitePlus_${{ env.YT_VERSION }}_5.0.1_unsigned.ipa"
          echo "package=$(ls -t packages | head -n1)" >> $GITHUB_OUTPUT
          echo -e "==> \033[1mSHASUM256: $(shasum -a 256 packages/*.ipa | cut -f1 -d' ')\033[0m"
          echo -e "==> \033[1mBundle ID: ${{ env.BUNDLE_ID }}\033[0m"
        env:
          THEOS: ${{ github.workspace }}/theos
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_NAME: ${{ inputs.app_name }}

      # ------------------------------------------------------------
      # 4. ✨ Fastlane Signing ✨
      # ------------------------------------------------------------
      - name: Install fastlane
        run: sudo gem install fastlane -NV

      - name: Import signing certificate into keychain
        run: |
          echo "${{ secrets.CERTIFICATE_P12 }}" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" ios-build.keychain
          security default-keychain -s ios-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ios-build.keychain
          security import cert.p12 -k ios-build.keychain -P "${{ secrets.CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" ios-build.keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Decode provisioning profile
        run: echo "${{ secrets.MOBILEPROVISION_BASE64 }}" | base64 --decode > profile.mobileprovision

      - name: Re-sign IPA with fastlane
        id: resign
        run: |
          fastlane run resign \
            ipa:"${{ github.workspace }}/main/packages/${{ steps.build_package.outputs.package }}" \
            signing_identity:"$(security find-identity -p codesigning -v | grep -m1 "Apple Distribution" | awk '{print $2}')" \
            provisioning_profile_path:"${{ github.workspace }}/profile.mobileprovision" \
            bundle_identifier:"${{ inputs.bundle_id }}" \
            display_name:"${{ inputs.app_name }}" \
            output_path:"${{ github.workspace }}/main/packages/YTLitePlus_${{ env.YT_VERSION }}_5.0.1.ipa"
          echo "signed_package=YTLitePlus_${{ env.YT_VERSION }}_5.0.1.ipa" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------
      # 5. Upload / Release –– reference the **signed** IPA
      # ------------------------------------------------------------
      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: YTLitePlus_${{ env.YT_VERSION }}_${{ env.YTLITE_VERSION }}
          path: ${{ github.workspace }}/main/packages/${{ steps.resign.outputs.signed_package }}
          if-no-files-found: error

      - name: Upload Artifact to Catbox
        if: ${{ inputs.catbox_upload }}
        run: |
          RESPONSE=$(curl -F "reqtype=fileupload" -F "fileToUpload=@${{ github.workspace }}/main/packages/${{ steps.resign.outputs.signed_package }}" https://catbox.moe/user/api.php)
          CATBOX_URL=$(echo $RESPONSE | grep -o -E 'https://files.catbox.moe/[^" ]*')
          echo "Uploaded artifact to $CATBOX_URL"
          echo "CATBOX_FILE=$(echo $CATBOX_URL | sed 's|https://files.catbox.moe/||')" >> $GITHUB_ENV
          echo "CATBOX_URL=$CATBOX_URL" >> $GITHUB_ENV

      - name: Prepare Release Notes
        if: ${{ inputs.create_release }}
        run: |
          TODAY=$(date '+%Y-%m-%d')
          sed "s/%ytliteplus_version%/${{ env.YTLITE_VERSION }}/g; s/%youtube_version%/5.0.1/g; s/%catbox_url%/${{ env.CATBOX_FILE }}/g; s/%date%/$TODAY/g" \
            main/.github/RELEASE_TEMPLATE/Release.md > ${{ github.workspace }}/release_notes.md

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.YT_VERSION }}-5.0.1
          name: v${{ env.YT_VERSION }}-5.0.1 - YTLitePlus
          files: ${{ github.workspace }}/main/packages/${{ steps.resign.outputs.signed_package }}
          draft: true
          body_path: ${{ github.workspace }}/release_notes.md

      - name: Update Altstore Source with latest release
        if: ${{ inputs.create_release }}
        run: |
          curl --location --request POST 'https://api.github.com/repos/Balackburn/YTLitePlusAltstore/dispatches' \
          --header 'Authorization: token ${{ secrets.PERSONAL_ACCESS_TOKEN }}' \
          --header 'Content-Type: application/json' \
          --data-raw '{"event_type": "update-altstore-source-trigger" }'

      # ------------------------------------------------------------
      # 6. Summaries –– unchanged
      # ------------------------------------------------------------
      - name: Job Summary
        run: echo -e '### 📺 Build & Sign Complete' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Artifact Upload
        if: ${{ inputs.upload_artifact }}
        run: echo -e '### 📦 Artifact Upload\n\nThe signed artifact was uploaded successfully! Refresh and [scroll down](#artifacts) to view it.' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Catbox Upload
        if: ${{ inputs.catbox_upload }}
        run: echo -e '### 🐱 Catbox Upload\n\nThe Catbox upload was successful! Link: '$CATBOX_URL >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Draft Release
        if: ${{ inputs.create_release }}
        run: |
          RELEASES_URL="https://github.com/${{ github.repository }}/releases"
          echo -e '### 🚀 Draft Release\n\nThe release draft has been created successfully!\nBrowse releases: '$RELEASES_URL >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Cleanup link
        run: |
          DELETE_RUNS_URL="https://github.com/${{ github.repository }}/actions/workflows/delete-workflow-runs.yml"
          echo -e '### 🧹 Cleanup\n\nRemove previous workflow runs here: '$DELETE_RUNS_URL >> $GITHUB_STEP_SUMMARY
